.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-avatar img{display:block;width:100%;height:auto}

.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-content p:empty{display:none}
.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-ui-row[data-variant="flow"]{display:flex;flex-wrap:wrap;align-items:center;gap:.24em .44em}

.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-ui-row[data-variant="flow"]>.wr-ui-divider{flex-basis:100%}
.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-ui-row[data-variant="flow"]>:is(.wr-ui-progress,.wr-ui-countdown){flex:1 1 100%}
.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-ui-row[data-variant="flow"]>.wr-ui-image.wr-image-scale-width{flex-basis:100%}
.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-ui-row{gap:.34em .6em;align-items:stretch}
.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-ui-cell{min-width:0;padding:var(--ui-cell-padding,.32em .45em);display:flex;align-items:center;flex-wrap:wrap;gap:.3em}

.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-ui-image{margin:0;gap:.5em;align-items:center}
.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-ui-image figcaption{min-width:0;white-space:pre-wrap}
.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-ui-image>img{object-fit:contain;flex:none}

.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-ui-component[style*="--wr-field-color"]{color:var(--wr-field-color)}
.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-ui-image.wr-image-right{flex-direction:row-reverse}

.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-ui-badge{line-height:1.3;max-width:100%;white-space:normal}
.wr-theme-custom.wr-theme-components.wr-style-titanium-forge .wr-ui-list{gap:.4em}
