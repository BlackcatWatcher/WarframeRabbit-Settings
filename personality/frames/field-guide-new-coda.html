.wr-theme-custom.wr-theme-components.wr-style-field-guide-new .wr-avatar img{display:block;width:100%;height:auto}
.wr-theme-custom.wr-theme-components.wr-style-field-guide-new :is(.wr-panel-head,.wr-panel-foot,.wr-ui-image>figcaption,.wr-stat-number>small,.wr-meter-label,.wr-meter-track>small,.wr-ui-countdown>span,.wr-ui-badge>span):empty{display:none}
.wr-theme-custom.wr-theme-components.wr-style-field-guide-new .wr-content p:empty{display:none}

.wr-theme-custom.wr-theme-components.wr-style-field-guide-new .wr-ui-row{gap:.34em .6em;align-items:stretch}
.wr-theme-custom.wr-theme-components.wr-style-field-guide-new .wr-ui-cell{min-width:0;padding:var(--ui-cell-padding,.32em .45em);display:flex;align-items:center;flex-wrap:wrap;gap:.3em}
