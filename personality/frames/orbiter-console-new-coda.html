.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-background{z-index:-2;opacity:var(--wr-bg-opacity)}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-background img{display:block;width:100%;height:100%;object-fit:cover}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-avatar{z-index:0;right:.12em;bottom:1.5em;opacity:var(--wr-avatar-opacity);pointer-events:none}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-avatar img{display:block;width:100%;height:auto}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new :is(.wr-panel-head,.wr-panel-foot,.wr-ui-image>figcaption,.wr-stat-number>small,.wr-meter-label,.wr-meter-track>small,.wr-ui-countdown>span,.wr-ui-badge>span):empty{display:none}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-content p:empty{display:none}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-row[data-variant="flow"]{display:flex;flex-wrap:wrap;align-items:center;gap:.24em .44em}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-row[data-variant="break"]{display:block;flex:0 0 100%;height:0;padding:0;margin:0}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-row[data-variant="flow"]>.wr-ui-divider{flex-basis:100%}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-row[data-variant="flow"]>:is(.wr-ui-progress,.wr-ui-countdown){flex:1 1 100%}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-row[data-variant="flow"]>.wr-ui-image.wr-image-scale-width{flex-basis:100%}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-row{gap:.34em .6em;align-items:stretch}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-cell{min-width:0;padding:var(--ui-cell-padding,.32em .45em);display:flex;align-items:center;flex-wrap:wrap;gap:.3em}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-text{line-height:inherit}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-image{margin:0;gap:.5em;align-items:center}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-image figcaption{min-width:0;white-space:pre-wrap}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-image>img{object-fit:contain;flex:none}

.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-image.wr-image-large>img{width:64px;height:64px}

.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-image.wr-image-scale-width>img{width:100%;height:auto;max-width:100%}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-component[style*="--wr-field-color"]{color:var(--wr-field-color)}
.wr-theme-custom.wr-theme-components.wr-style-orbiter-console-new .wr-ui-image.wr-image-right{flex-direction:row-reverse}
